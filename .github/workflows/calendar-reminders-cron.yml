name: Calendar reminder cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  calendar-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/calendar-reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DEMO_APP_URL: ${{ vars.DEMO_APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set in repository secrets."
            exit 1
          fi
          if [ -z "$DEMO_APP_URL" ]; then
            echo "DEMO_APP_URL is not set in repository variables."
            exit 1
          fi
          curl -fsS \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${DEMO_APP_URL%/}/api/cron/calendar-reminders"
